# Build-time module list for our from-source FreeSWITCH build.
# Only what this lab needs (SIP registration, WebRTC/WSS, dialplan bridging,
# CDR groundwork, ESL for the future dashboard). Trimmed from FreeSWITCH's
# default ~100+ module list per docs/INTAKE.md §2/§3.
#
# NOTE: mod_dptools (dialplan applications: answer/bridge/set/export/...)
# and mod_loopback are required additions beyond the intake doc's module
# list -- without mod_dptools the dialplan can't do anything at all.

loggers/mod_console
loggers/mod_logfile

endpoints/mod_sofia
endpoints/mod_loopback

applications/mod_commands
applications/mod_dptools

dialplans/mod_dialplan_xml

event_handlers/mod_event_socket
event_handlers/mod_cdr_csv
event_handlers/mod_json_cdr

formats/mod_sndfile
formats/mod_native_file
formats/mod_tone_stream

codecs/mod_opus
